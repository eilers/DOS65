[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "run8080"
version = "0.1.0"
description = "8080 emulator hosted by DOS/65 on the MEGA65"
requires-python = ">=3.11"
dependencies = ["py65>=1.2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
